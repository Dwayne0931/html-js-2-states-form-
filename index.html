<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show Hide Form</title>
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <div class="container">
        <div id="input_form" class="input_form">
            <label for="name">Name: </label>
            <input type="text" id="name" name="name" placeholder="Enter your Name..." required><br>

            <!--Need to fix this, incomplete -->
            <label for="ic">IC Number: </label>
            <input type="number" id="ic"><br>

            <label for="matric">Matric Number: </label>
            <input type="text" id="matric" name="matric" placeholder="Enter your Matric..." required><br>

            <label for="phone">Phone Number: </label>
            <input type="number" id="phone"><br>

            <label for="address">Address: </label>
            <input type="text" id="address" name="address" placeholder="Enter your Address..." required><br>
            <button onclick="show_form()">Complete</button>
        </div>

        <div id="show_form" class="show_form">
            <p><span>Name:</span><span id="show_name"></span></p>
            <p><span>IC Number:</span><span id="show_ic"></span></p>
            <p><span>Matric Number:</span><span id="show_matric"></span></p>
            <p><span>Phone Number:</span><span id="show_phone"></span></p>
            <p><span>Address:</span><span id="show_address"></span></p>
            <button onclick="cancel_form()">Cancel</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
